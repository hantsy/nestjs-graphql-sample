<mat-card>
  <mat-card-header>
    <mat-card-title>
      <mat-icon>post_add</mat-icon> Create New Post
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (error()) {
      <p class="error-msg">{{ error() }}</p>
    }
    <app-post-form
      submitLabel="Create Post"
      cancelLink="/posts"
      [submitting]="submitting()"
      (submitted)="onSubmit($event)"
    />
  </mat-card-content>
</mat-card>
