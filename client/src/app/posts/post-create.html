<mat-card>
  <mat-card-header>
    <mat-card-title>Create New Post</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (error()) {
      <p style="color: red;">{{ error() }}</p>
    }
    <app-post-form
      submitLabel="Create Post"
      cancelLink="/posts"
      [submitting]="submitting()"
      (submitted)="onSubmit($event)"
    />
  </mat-card-content>
</mat-card>
