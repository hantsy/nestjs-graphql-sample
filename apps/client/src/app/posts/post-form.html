<mat-form-field class="full-width" appearance="outline">
  <mat-label>Title</mat-label>
  <input matInput [(ngModel)]="title" required [disabled]="submitting()" />
</mat-form-field>

<mat-form-field class="full-width" appearance="outline">
  <mat-label>Content</mat-label>
  <textarea matInput [(ngModel)]="content" rows="10" required [disabled]="submitting()"></textarea>
  <mat-hint align="end">{{ content.length }} characters (min 10)</mat-hint>
</mat-form-field>

<div class="form-actions">
  <button mat-stroked-button [routerLink]="cancelLink()" [disabled]="submitting()">
    <mat-icon>close</mat-icon> Cancel
  </button>
  <button
    mat-flat-button
    color="primary"
    [disabled]="!title.trim() || !content.trim() || content.trim().length < 10 || submitting()"
    (click)="onSubmit()"
  >
    <mat-icon>{{ submitting() ? 'hourglass_top' : 'save' }}</mat-icon>
    {{ submitting() ? 'Saving...' : submitLabel() }}
  </button>
</div>
