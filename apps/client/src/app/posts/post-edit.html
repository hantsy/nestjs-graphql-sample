@if (loading()) {
  <div class="skeleton-card">
    <div class="skeleton skeleton-title"></div>
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-line"></div>
  </div>
} @else if (post()) {
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        <mat-icon>edit</mat-icon> Edit Post
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (error()) {
        <p class="error-msg">{{ error() }}</p>
      }
      <app-post-form
        submitLabel="Update Post"
        cancelLink="/posts"
        [initialTitle]="post()!.title"
        [initialContent]="post()!.content"
        [submitting]="submitting()"
        (submitted)="onSubmit($event)"
      />
    </mat-card-content>
  </mat-card>
} @else {
  <div class="empty-state">
    <mat-icon class="empty-icon">error_outline</mat-icon>
    <p>This post doesn't exist or was removed.</p>
    <a mat-stroked-button routerLink="/posts">
      <mat-icon>arrow_back</mat-icon> Back to Posts
    </a>
  </div>
}
