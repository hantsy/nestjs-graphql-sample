<mat-toolbar color="primary">
  <a mat-button routerLink="/" class="toolbar-brand">
    <mat-icon>article</mat-icon>
    {{ title }}
  </a>
  <span class="spacer"></span>
  <a mat-button routerLink="/posts" routerLinkActive="active" class="toolbar-btn nav-link">
    <mat-icon>list</mat-icon> Posts
  </a>
  <a mat-flat-button routerLink="/posts/new" color="accent" class="toolbar-btn" routerLinkActive="active">
    <mat-icon>add</mat-icon> New Post
  </a>
  <button mat-icon-button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="themeLabel()">
    <mat-icon>{{ themeIcon() }}</mat-icon>
  </button>
</mat-toolbar>

<main class="container">
  <router-outlet />
</main>
